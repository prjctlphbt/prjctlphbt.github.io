# Jekyll configuration
title: Beijing Restaurant - Authentic Chinese Cuisine in Washington DC
description: Experience authentic Beijing cuisine in Washington DC. Traditional recipes, fresh ingredients, and warm hospitality await you at Beijing Restaurant.
url: ""
baseurl: ""

# Build settings
markdown: kramdown
permalink: /blog/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collections
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
